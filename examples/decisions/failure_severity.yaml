# How bad is the problem this tool result shows? Ordered levels.
#   none         the call worked; nothing to act on
#   minor        it worked (or found nothing), with warnings, partial results or noise the agent can ignore
#   recoverable  it failed, and the agent can fix it itself: wrong path, typo, failing test, conflict, bad args
#   blocking     it failed (or the result shows the task can't proceed) for a reason outside the agent's reach:
#                credentials, permissions, quotas and rate limits, policy, outages
# Contrasts: matched sets, the same call with an output at each level (written for this spec, not from traces).
# Validate: examples/failure_severity/failure_severity.py (as a single handle it grades weakly; see failure_severity_graded.yaml)

decision: failure_severity
kind: levels
levels: [none, minor, recoverable, blocking]
unit: tool_result
applies_when: span.kind == "tool_result"
encoder: google/embeddinggemma-2@<rev>
readout:
  layer: final
  method: ridge

# Hard negatives: results that *discuss* errors without being one (source, docs, changelogs, tests). Read as none.
hard_negatives:
  - call: 'read: {"path": "src/http/retry.ts"}'
    output: "// Retry on 429 (rate limit) and 503 (service unavailable) with exponential backoff.\nexport async function withRetry(fn) {\n  for (let i = 0; i < 5; i++) {\n    try { return await fn(); } catch (e) { if (!isRetryable(e)) throw e; }\n  }\n}"
    label: none
  - call: 'read: {"path": "docs/troubleshooting.md"}'
    output: "## Permission denied\nIf you see `EACCES: permission denied`, check that the cache directory is writable.\n## 401 Unauthorized\nYour token has expired; run `acme login` again."
    label: none
  - call: 'read: {"path": "CHANGELOG.md", "offset": 1, "limit": 40}'
    output: "## 2.4.1\n### Fixed\n- Fixed crash when the API returned 403 Forbidden for expired credentials\n- Fixed ECONNREFUSED errors not being retried\n- Quota exceeded errors now show the reset time"
    label: none
  - call: 'read: {"path": "tests/errors.test.ts"}'
    output: "test(\"throws on invalid credentials\", async () => {\n  await expect(login(\"bad\")).rejects.toThrow(\"authentication failed\");\n});\ntest(\"maps 429 to RateLimitError\", () => { ... });"
    label: none
  - call: 'bash: {"command": "rg -n \"PermissionDenied|Forbidden\" src"}'
    output: "src/errors.ts:12:export class PermissionDeniedError extends ApiError {}\nsrc/errors.ts:13:export class ForbiddenError extends ApiError {}\nsrc/api/client.ts:88:    if (res.status === 403) throw new ForbiddenError(body);"
    label: none
  - call: 'read: {"path": "src/auth/credentials.py"}'
    output: "class CredentialsError(Exception):\n    \"\"\"Raised when stored credentials are missing or expired.\"\"\"\n\ndef load_credentials(path):\n    if not path.exists():\n        raise CredentialsError(f\"no credentials at {path}\")"
    label: none
  - call: 'bash: {"command": "gh issue view 812 --json title,body"}'
    output: "{\"title\":\"Build fails with 'No space left on device' on CI\",\"body\":\"Since Tuesday the docker build step fails with ENOSPC. Steps to reproduce: ...\"}"
    label: none
  - call: 'read: {"path": "README.md", "offset": 120, "limit": 30}'
    output: "### Rate limits\nThe free plan allows 1000 requests per day. When you exceed it the API returns `429 Too Many Requests` and a `Retry-After` header."
    label: none

calibration:
  method: ordinal
  sample: 60
abstain:
  mahalanobis_quantile: 0.99
escalate:
  when: "confidence < 0.5"
  to: llm
  prompt: |-
    Here is a tool call an AI coding agent made and the output it returned:

    {unit}

    How serious is the problem this result shows for the agent's task? none: the call worked. minor: it worked,
    with ignorable warnings or an empty result. recoverable: it failed and the agent can fix it itself. blocking:
    it failed for a reason the agent can't fix alone (credentials, permissions, quotas, policy, outages).

