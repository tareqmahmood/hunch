# Did the tool call itself fail (return an error or refuse the request)?
# Compile:  eg2cpu-decisions compile decisions/tool_call_failed.yaml --calibration <60 labelled rows>
# Contrasts: 56 matched synthetic pairs (`hunch_examples.synthetic`, seed 11). examples/tool_call_failed/tool_call_failed.py
# compiles and checks it on real coding-agent traces.

decision: tool_call_failed
kind: boolean
unit: tool_result                   # embeds "{call}\n{output}"
applies_when: span.kind == "tool_result"

encoder: google/embeddinggemma-2@<rev>
readout:
  layer: final                      # chosen on real traces, not the synthetic contrasts (pi test AUC 0.90; layer 4: 0.89)
  method: auto                      # default (diff of means) unless it misreads a hard negative held out and the
                                    # other method doesn't; else the one that misreads fewest. See the handle's report.

hard_negatives:                     # look like "yes" but are "no": the tool worked, the world is broken
  - "Speed test failed: No Connection."
  - "No SIM card detected in the device."
  - "Payment declined by the card issuer."
  - "No flights available on the selected date."

calibration:
  method: platt
  sample: 60
abstain:
  mahalanobis_quantile: 0.99
escalate:
  when: "|p - 0.5| < 0.2"
  to: llm
  prompt: |-
    Here is a tool call an AI agent made and the output it returned:

    {unit}

    Did the tool call itself fail, i.e. return an error or refuse the request? A tool that ran successfully and
    reports bad news about the world (for example a failed speed test or a missing SIM card) did NOT fail.

