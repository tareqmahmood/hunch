# Failure severity, graded: the second step of a hybrid program.
#   step 1 (code):     the harness did not flag the result (span.is_error == "false") -> none
#   step 2 (this):     a flagged result -> minor / recoverable / blocking
#     minor        flagged, but harmless: an empty search, nothing to commit, checks still pending, cleanup failing
#                  after the real work succeeded; the task can carry on as if it had worked
#     recoverable  it failed, and the agent can fix it itself
#     blocking     it failed for a reason outside the agent's reach: credentials, permissions, quotas, policy, outages
# Calibrate on flagged errors only. Contrasts are the 36 situations of failure_severity.yaml with flagged-but-harmless
# `minor` outputs, and bash failures carrying the harness's exit-code line.

decision: failure_severity_graded
kind: levels
levels:
- minor
- recoverable
- blocking
unit: tool_result
applies_when: span.kind == "tool_result" and span.is_error == "true"
encoder: google/embeddinggemma-2@<rev>
readout:
  layer: final        # what layer: auto picks on every split of the labelled set
  method: ridge       # method: auto would fall back to diff_of_means (no hard negatives), which grades worse
calibration:
  method: ordinal
  sample: 60
abstain:
  mahalanobis_quantile: 0.99
escalate:
  when: confidence < 0.5
  to: llm
  prompt: 'Here is a tool call an AI coding agent made and the output it returned:


    {unit}


    How serious is the problem this result shows for the agent''s task? none: the call worked. minor: it worked,

    with ignorable warnings or an empty result. recoverable: it failed and the agent can fix it itself. blocking:

    it failed for a reason the agent can''t fix alone (credentials, permissions, quotas, policy, outages).'
